name: Bug report
description: 报告可复现的问题
title: "[Bug] "
body:
  - type: input
    id: version
    attributes: {label: 扩展版本}
    validations: {required: true}
  - type: input
    id: browser
    attributes: {label: 浏览器与版本}
    validations: {required: true}
  - type: input
    id: os
    attributes: {label: 操作系统}
  - type: textarea
    id: steps
    attributes: {label: 复现步骤}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: 预期行为}
  - type: textarea
    id: actual
    attributes: {label: 实际行为与控制台错误}
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除截图、日志或导出文件中的敏感提示词。
          required: true
