name: Release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - options.html
      - options.css
      - options-*.js
      - mode.js
      - icons/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/release.yml
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Create versioned release when absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" dist/*.zip \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Prompt Manager $TAG"
          fi
